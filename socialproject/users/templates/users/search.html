{% extends 'users/base.html' %}
{% load static %}
{% block body %}
<div class="max-w-lg mx-auto px-4 sm:px-6 py-10">
    <form method="get" class="mb-6">
        <input type="text" name="q" value="{{ query }}" placeholder="Search username..."
            class="w-full border rounded px-4 py-2 shadow-sm">
    </form>

    {% if query %}
    <div class="space-y-3">
        {% for u in results %}
        <a href="{% url 'profile_detail' u.username %}" class="flex items-center gap-3 bg-white rounded shadow-sm p-3 hover:bg-gray-50">
            {% if u.profile.photo %}
            <img class="h-10 w-10 rounded-full object-cover" src="{{ u.profile.photo.url }}" alt="">
            {% else %}
            <img class="h-10 w-10 rounded-full object-cover" src="{% static 'users/images/social.png' %}" alt="">
            {% endif %}
            <span class="font-semibold text-gray-700">{{ u.username }}</span>
        </a>
        {% empty %}
        <p class="text-gray-400">No users found for "{{ query }}".</p>
        {% endfor %}
    </div>
    {% endif %}
</div>
{% endblock %}
